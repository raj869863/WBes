{# Compact global top header: notification + user control (visual only). #}
<header class="app__topbar">
  <div class="app__topbar__left"><!-- global controls can be added here later --></div>
  <div class="app__topbar__right">
    <button type="button" class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M10 3.5a3.8 3.8 0 0 1 3.8 3.8v2.9l1.3 2.3H4.9l1.3-2.3V7.3A3.8 3.8 0 0 1 10 3.5z" stroke-linejoin="round"></path>
        <path d="M8.6 15.3a1.5 1.5 0 0 0 2.8 0" stroke-linecap="round"></path>
      </svg>
      <span class="icon-btn__dot" aria-hidden="true"></span>
    </button>
    <span class="user-chip">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="10" cy="7" r="3"></circle>
        <path d="M4.8 16.2c.7-2.6 2.8-3.9 5.2-3.9s4.5 1.3 5.2 3.9" stroke-linecap="round"></path>
      </svg>
      HR Team
    </span>
  </div>
</header>
